{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth_title %}Reset password{% endblock %}
{% block auth_subtitle %}We'll email you a reset link{% endblock %}
{% block auth_content %}
<form method="post">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label small fw-semibold">Email</label><input type="email" name="email" class="form-control" required></div>
  <button class="btn btn-primary w-100">Send reset link</button>
</form>
<p class="text-center small mt-4 mb-0"><a href="{% url 'accounts:login' %}">Back to login</a></p>
{% endblock %}
