{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<form method="post" class="card" style="max-width:520px">
  {% csrf_token %}
  <div class="card-body">
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">{{ field.label }}</label>
        <input type="password" name="{{ field.html_name }}" class="form-control" required>
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary">Update password</button>
  </div>
</form>
{% endblock %}
