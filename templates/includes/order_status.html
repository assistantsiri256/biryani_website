<span class="badge {% if status == 'paid' %}bg-success{% elif status == 'pending' %}bg-warning text-dark{% elif status == 'refunded' %}bg-info text-dark{% elif status == 'released' or status == 'approved' %}bg-primary{% elif status == 'reversed' or status == 'rejected' %}bg-danger{% else %}bg-secondary{% endif %}">{{ label }}</span>
