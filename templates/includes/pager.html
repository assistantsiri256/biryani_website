{% if page.has_other_pages %}
<div class="card-footer d-flex justify-content-between align-items-center small">
  {% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Previous</a>{% else %}<span></span>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span>
  {% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next →</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
