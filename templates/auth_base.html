{% extends "base.html" %}
{% block body %}
<div class="auth-wrap">
  <div class="card auth-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="auth-logo mb-3"><i class="bi bi-diagram-3-fill"></i></div>
        <h1 class="h4 fw-bold mb-1">{% block auth_title %}{% endblock %}</h1>
        <p class="text-muted small mb-0">{% block auth_subtitle %}BinaryPro Network Management System{% endblock %}</p>
      </div>
      {% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>{% endfor %}
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
